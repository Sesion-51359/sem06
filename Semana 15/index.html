<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://tailwindcss.com"></script>
    <link href="">
    <title>Document</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->

</head>

<body>
    <div class=" flex gap-5 flex-col m-18 mt-0">

        <div class="text-3x1 font-bold underline">
            Hello World
        </div>

        <div>
            <p class="text-4xl text-center mb-4">Hola</p>
            <div class="m-5 w-full max-w-md mx-auto bg-gray-200 rounded-full h-2.5 overflow-hidden dark:bg-gray-700">
                <div class="bg-blue-600 h-2.5 rounded-full animate-pulse w-3/4"></div>
            </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-r-3xl ">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-t-indigo-500 border-slate-600 mb-4">
            </div>
            <span class="text-sm font-medium">animate-spin</span>
        </div>




        <!-- <div class="p-8 flexjustify-start items-center"> -->
        <div class="relative inline-block rounded-xl border border-gray-700 px-6 py-3">
            <span class="text-[#0091ff] font-semibold text-lg">
                Transactions
            </span>

            <span class="absolute -top-1.5 -right-1.5 flex size-3.5">
                <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-400 opacity-75"></span>
                <span class="relative inline-flex size-3.5 rounded-full bg-[#00a2ff]"></span>
            </span>

        </div>
        <!-- </div> -->
    </div>

    <div class="relative">
        <div class="absolute animate-pulse bg-red-300 w-20 h-10 rounded-lg mx-6 ml-20 top-9.5 left-20 z-2">
        </div>
    </div>

    <div
        class="w-120 bg-white dark:bg-indigo-400 dark:text-white rounded-2xl shadow-xl border border-slate-100 px-7 mx-auto mt-3">
        <div class="px-0 pt-6">
            <div class="flex items-center justify-between gap-2 hover:bg-green-300  bg-green-200 border border-green-300 rounded-2xl mx-0 pr-5
                transition duration-75 ease-in-out hover:scale-105">
                <div class="flex p-5 text-center z-10">
                    Registro
                </div>

                <div class="flex justify-between gap-3 items-center">
                    <span class="relative flex h-3 w-3 hover:shadow-x1">
                        <span
                            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-orange-400 opacity-75"></span>
                        <span class="relative inline-flex h-3 w-3 rounded-full bg-orange-500"></span>
                    </span>
                    <p class=" text-orange-500 font-bold uppercase text-3x1">Warning</p>
                </div>
            </div>
        </div>

        <!-- LInea de progreso-->
        <div class="m-5 h-5 w-full max-w-md mx-auto bg-gray-200 rounded-full overflow-hidden dark:bg-gray-700">
            <div class="bg-blue-600 h-5 rounded-full animate-pulse w-3/4"></div>
        </div>


        <div class="p-5 flex flex-col gap-3">
            <span class="text-xs font-bold text-indigo-600 uppercase tracking-wide">Record</span>
            <!-- <h2 class="text-xl font-bold text-slate-800">Boton</h2> -->
            <p class="text-sm text-slate-500 leading-relaxed">
                Texto
            </p>

            <!-- Botón / Acción -->
            <button
                class="mx-auto mt-2 w-50 bg-slate-900 text-white text-sm font-semibold py-2.5 px-4 rounded-xl hover:bg-slate-800 ">
                Registrar
            </button>
        </div>

    </div>

    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script> -->
</body>

</html>
