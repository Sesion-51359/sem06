<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="card  mt-5" style="width: 18rem;">

        <img id="vistaPrevia" class="card-img-top img-fluid" src="" alt="Vista previa de la imagen"
            style="display: none; object-fit: cover; max-height: 200px; border: 1px solid #ccc; border-radius: 8px;">
        <div class="card-body">
            <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s
                content.</p>
        </div>
    </div>



    <div class="upload-container">
        <label for="selectorImagenes">Selecciona una imagen:</label>
        <br>
        <input type="file" id="selectorImagenes" accept="image/*" onchange="mostrarVistaPrevia(event)">
        <br><br>

    </div>

    <div class="row bg-danger">
        <div class="col-12 col-sm-6 col-lg-3 p-3 m-3 bg-secondary">
            test
        </div>
    </div>

    <script>
        function mostrarVistaPrevia(event) {
            const archivos = event.target.files;
            const imagenPreview = document.getElementById('vistaPrevia');

            if (archivos && archivos[0]) {
                const primerArchivo = archivos[0];

                imagenPreview.src = URL.createObjectURL(primerArchivo);

                imagenPreview.style.display = 'block';
            }
        }
    </script>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
